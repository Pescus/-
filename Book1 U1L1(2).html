<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<title>日语课文播放器</title>

<style>

body{
    font-family: sans-serif;
    padding: 30px;
    line-height: 2.2;
}

/* 标题区域 */

.titleRow{

    display: flex;

    align-items: center;

    gap: 20px;

}

/* 句子 */

.sentence{

    font-size: 24px;

    margin-top: 15px;

    cursor: pointer;

    padding: 8px;

    border-radius: 10px;

    transition: 0.3s;

}

.sentence:hover{

    background-color: #f5f5f5;

}

/* 实时字幕高亮 */

.highlight{

    color: red;

    font-weight: bold;

}

/* 单词 */

.word{

    color: blue;

    cursor: pointer;

}

.word:hover{

    text-decoration: underline;

}

/* 表格 */

table{

    border-collapse: collapse;

    width: 100%;

    margin-top: 15px;

}

th, td{

    border: 1px solid gray;

    padding: 12px;

    text-align: center;

}

h1{

    color: darkblue;

}

h2{

    color: darkred;

}

</style>
</head>

<body>

<h1>第1課  小李是中国人</h1>

<div class="titleRow">

<h2>基本課文</h2>

<audio id="textAudio" controls>
    <source src="Audio/Text_1.mp3" type="audio/mpeg">
</audio>

</div>

<!-- 第一行 -->

<div class="sentence" onclick="jumpTo(4)">

<span id="t1a">
第1課
</span>

　

<span id="t1b">

<ruby>
李<rt>り</rt>
</ruby>
さんは

<ruby>
中国人<rt>ちゅうごくじん</rt>
</ruby>

です

</span>

</div>

<!-- 第二行 -->

<div class="sentence" onclick="jumpTo(11)">

1.

<span id="t2a">

<ruby>
李<rt>り</rt>
</ruby>
さんは

</span>

　

<span id="t2b">

<ruby>
中国人<rt>ちゅうごくじん</rt>
</ruby>

です。

</span>

</div>

<!-- 第三行 -->

<div class="sentence" onclick="jumpTo(15)">

2.

<span id="t3a">

<ruby>
森<rt>もり</rt>
</ruby>
さんは

</span>

　

<span id="t3b">

<ruby>
学生<rt>がくせい</rt>
</ruby>

ではありません。

</span>

</div>

<!-- 单词 -->

<h2>単語</h2>

<table>

<tr>
<th>単語</th>
<th>読み</th>
<th>発音</th>
</tr>

<tr>

<td>

<span
class="word"
onclick="playWord('Audio/1.mp3')">

<ruby>
中国人<rt>ちゅうごくじん</rt>
</ruby>

</span>

</td>

<td>
ちゅうごくじん
</td>

<td>
Tyuugokùziɴ
</td>

</tr>

</table>

<script>

const audio =
document.getElementById("textAudio");

/* 点击句子跳转 */

function jumpTo(time){

    audio.currentTime = time;

    audio.play();

}

/* 单词发音 */

function playWord(file){

    const wordAudio =
    new Audio(file);

    wordAudio.play();

}

/* 清除所有高亮 */

function clearHighlight(){

    const all =
    document.querySelectorAll("span");

    all.forEach(item=>{

        item.classList.remove("highlight");

    });

}

/* 实时字幕 */

audio.addEventListener("timeupdate", ()=>{

    const t = audio.currentTime;

    clearHighlight();

    /* 第一行  第N课 ...... */

    if(t >= 5 && t < 6){

        document
        .getElementById("t1a")
        .classList
        .add("highlight");

    }

    if(t >= 6 && t < 12){

        document
        .getElementById("t1b")
        .classList
        .add("highlight");

    }

    /* 第二行  1. */

    if(t >= 12 && t < 13.5){

        document
        .getElementById("t2a")
        .classList
        .add("highlight");

    }

    if(t >= 13.5 && t < 17){

        document
        .getElementById("t2b")
        .classList
        .add("highlight");

    }

    /* 第三行 2. */

    if(t >= 17 && t < 19){

        document
        .getElementById("t3a")
        .classList
        .add("highlight");

    }

    if(t >= 19 && t < 21){

        document
        .getElementById("t3b")
        .classList
        .add("highlight");

    }

    /* 第四行 3. */

    if(t >= 22.5 && t < 24.6){

        document
        .getElementById("t4a")
        .classList
        .add("highlight");

    }    
    
    if(t >= 24.8 && t < 26.5){

        document
        .getElementById("t4b")
        .classList
        .add("highlight");

    }
    
    /* 第五行 4. */

    if(t >= 29.5 && t < 30.5){

        document
        .getElementById("t5b")
        .classList
        .add("highlight");

    }

    if(t >= 30.5 && t < 33.5){

        document
        .getElementById("t3b")
        .classList
        .add("highlight");

    }
});


</script>

</body>
</html>
